<img class="emoji" draggable="false" alt="🏦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3e6.svg" data-marp-twemoji=""/> 出借身分證給朋友，讓信用不好的朋友可以申請網路銀行帳戶</p>

<header>哪些行為可能構成犯罪</header>

<h3 id="%E6%92%BF%E5%88%B0%E8%BA%AB%E5%88%86%E8%AD%89%E6%9C%AA%E5%8D%B3%E6%99%82%E6%AD%B8%E9%82%84">撿到身分證未即時歸還</h3>
<p><img class="emoji" draggable="false" alt="🪪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1faaa.svg" data-marp-twemoji=""/> 撿到身分證後放在家中兩週，期間用撿到身分證的影本申請貸款</p>
<ul>
<li data-marpit-fragment="1">民眾常誤以為拾得身分證可以先保留，但未即時送交警局，已可能觸犯侵占遺失物罪；若進一步使用，甚至構成偽造文書或冒名頂替。</li>
<li data-marpit-fragment="2">[例] 某民眾撿到身分證後放在家中兩週未處理，警方調閱監視器追查失主遭冒用情況時，該民眾因遲未歸還遭依刑法侵占遺失物函送檢方，且須出庭說明，造成相當困擾。</li>
<li data-marpit-fragment="3">影本同樣具有代表性，不可任意挪用。若將影本拿去申貸、開戶或其他未經同意用途，即屬偽造文書與個資法違反。</li>
<li data-marpit-fragment="4">[例] 租屋仲介保留房客身分證影本，後擅自將影本提供給貸款代辦使用。借款責任落到房客身上，該房客遭銀行追討近百萬債務，報案後才查出影本遭非法使用，仲介與代辦均遭起訴。</li>
</ul>
<footer><a href="https://www.tph.moj.gov.tw/4421/4475/632364/1344503/post">你是誰！很重要！（冒用身分證之十大問題）</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-marpit-scope-kaV1pHyr="" data-marpit-fragments="2" data-paginate="true" data-header="哪些行為可能構成犯罪" data-footer="[你是誰！很重要！（冒用身分證之十大問題）](https://www.tph.moj.gov.tw/4421/4475/632364/1344503/post)" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" data-marpit-pagination="4" style="--paginate:true;--header:哪些行為可能構成犯罪;--footer:[你是誰！很重要！（冒用身分證之十大問題）](https://www.tph.moj.gov.tw/4421/4475/632364/1344503/post);--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48">
<header>哪些行為可能構成犯罪</header>

<h3 id="%E5%B9%AB%E4%BB%96%E4%BA%BA%E7%BA%8C%E7%B4%84%E9%9B%BB%E4%BF%A1%E9%96%80%E8%99%9F">幫他人續約電信門號</h3>
<p><img class="emoji" draggable="false" alt="📡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e1.svg" data-marp-twemoji=""/> 好心幫朋友續約電信門號，所以在門市代填個人資料</p>
<ul>
<li data-marpit-fragment="1">電信門市或業務要求客人「代朋友續約、代填資料」，若簽名或填寫身分資料，使文件上表彰為「本人」之意思，即可能構成行使偽造私文書，後續偵查時常被法院或檢警採為不利證據。</li>
<li data-marpit-fragment="2">[例] 某手機門市要求顧客「幫朋友續約」，顧客照做後留下簽名。後因該門號涉及分期詐欺，警方調閱入網資料比對簽名，該顧客因「冒名簽署」遭偵辦，需出庭說明。</li>
</ul>
<footer><a href="https://www.tph.moj.gov.tw/4421/4475/632364/1344503/post">你是誰！很重要！（冒用身分證之十大問題）</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-marpit-scope-bw5FUMJj="" data-marpit-fragments="4" data-paginate="true" data-header="哪些行為可能構成犯罪" data-footer="[你是誰！很重要！（冒用身分證之十大問題）](https://www.tph.moj.gov.tw/4421/4475/632364/1344503/post)" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" data-marpit-pagination="5" style="--paginate:true;--header:哪些行為可能構成犯罪;--footer:[你是誰！很重要！（冒用身分證之十大問題）](https://www.tph.moj.gov.tw/4421/4475/632364/1344503/post);--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48">
<header>哪些行為可能構成犯罪</header>

<h3 id="%E5%87%BA%E5%80%9F%E8%BA%AB%E5%88%86%E8%AD%89">出借身分證</h3>
<p><img class="emoji" draggable="false" alt="🏦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3e6.svg" data-marp-twemoji=""/> 出借身分證給朋友，讓信用不好的朋友可以申請網路銀行帳戶</p>
<ul>
<li data-marpit-fragment="1">民眾常因好意外借身分證協助朋友開戶或申請貸款，卻不知此舉極可能助長人頭帳戶或詐欺金流。一旦詐欺發生，外借者通常難以脫身，往往涉及洗錢防制法、刑法詐欺罪及偽造文書罪。</li>
<li data-marpit-fragment="2">[例] 20歲的陳男為朋友「方便」借身分證去辦手機門號，門號後遭詐欺集團作為申請網銀與貸款工具，導致陳男收到地檢署通知並遭列為洗錢案件「共犯」。經多次筆錄與說明才排除犯罪嫌疑，但信用受損多年。</li>
<li data-marpit-fragment="3">詐騙集團常用徵才名義蒐集身分證正反面，作為建立人頭戶的資料來源，被害人常在不知情情況下變成詐欺、洗錢案件的嫌疑人。</li>
<li data-marpit-fragment="4">[例] 大學生黃女應徵「居家打字員」，依指示上傳身分證後即遭冒名辦理五個銀行帳戶。事後警方以監視器比對提出傳喚，經查清後才解除嫌疑。</li>
</ul>
<footer><a href="https://www.tph.moj.gov.tw/4421/4475/632364/1344503/post">你是誰！很重要！（冒用身分證之十大問題）</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-marpit-scope-Jp68jb1Z="" data-marpit-fragments="1" data-paginate="true" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" data-marpit-pagination="6" style="--paginate:true;--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48">
<h2 id="%E6%B3%95%E5%BE%8B%E7%9F%A5%E8%AD%98%E5%95%8F%E7%AD%94--%E9%80%B2%E9%9A%8E-%F0%9F%8D%82">法律知識問答 — 進階 <img class="emoji" draggable="false" alt="🍂" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f342.svg" data-marp-twemoji=""/></h2>
<p>罰多重：由重到輕排序</p>
<ol>
<li>殺人 / 重傷 / 傷害</li>
<li>強盜 / 搶奪 / 竊盜 / 侵占</li>
<li>電信詐欺 / 詐欺 / 偽造文書</li>
<li>洗錢</li>
</ol>
<ul>
<li data-marpit-fragment="1"><img class="emoji" draggable="false" alt="🔦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f526.svg" data-marp-twemoji=""/> 直覺</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-marpit-scope-9RCECphS="" data-paginate="true" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" data-marpit-pagination="7" style="--paginate:true;--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48">
<h3 id="%E7%94%9F%E5%91%BD%E8%BA%AB%E9%AB%94">生命、身體</h3>
<table>
<thead>
<tr>
<th style="text-align:left">刑法</th>
<th style="text-align:right">罪名</th>
<th style="text-align:left">罰則</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">§271 I</td>
<td style="text-align:right">殺人</td>
<td style="text-align:left">死刑、無期徒刑或10年以上有期徒刑 <small><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/></small></td>
</tr>
<tr>
<td style="text-align:left">§278 I</td>
<td style="text-align:right">重傷</td>
<td style="text-align:left">5年以上12年以下有期徒刑 <small><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/32-20e3.svg" data-marp-twemoji=""/></small></td>
</tr>
<tr>
<td style="text-align:left">§277 I</td>
<td style="text-align:right">傷害</td>
<td style="text-align:left">5年以下有期徒刑、拘役或50萬元以下罰金 <small><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/33-20e3.svg" data-marp-twemoji=""/></small></td>
</tr>
</tbody>
</table>
<ol>
<li>殺人者，處死刑、無期徒刑或10年以上有期徒刑。</li>
<li>使人受重傷者，處5年以上12年以下有期徒刑。</li>
<li>傷害人之身體或健康者，處5年以下有期徒刑、拘役或50萬元以下罰金。</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-marpit-scope-jG7wum3E="" data-paginate="true" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" data-marpit-pagination="8" style="--paginate:true;--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48">
<h3 id="%E8%87%AA%E7%94%B1%E8%B2%A1%E7%94%A2">自由、財產</h3>
<table>
<thead>
<tr>
<th style="text-align:left">刑法</th>
<th style="text-align:right">罪名</th>
<th style="text-align:left">罰則</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">§325 I</td>
<td style="text-align:right">強盜</td>
<td style="text-align:left">5年以上有期徒刑 <small><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/></small></td>
</tr>
<tr>
<td style="text-align:left">§328 I</td>
<td style="text-align:right">搶奪</td>
<td style="text-align:left">6月以上5年以下有期徒刑 <small><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/32-20e3.svg" data-marp-twemoji=""/></small></td>
</tr>
<tr>
<td style="text-align:left">§320 I</td>
<td style="text-align:right">竊盜</td>
<td style="text-align:left">5年以下有期徒刑、拘役或50萬元以下罰金 <small><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/33-20e3.svg" data-marp-twemoji=""/></small></td>
</tr>
<tr>
<td style="text-align:left">§335 I</td>
<td style="text-align:right">侵占</td>
<td style="text-align:left">5年以下有期徒刑、拘役或科或併科3萬元以下罰金 <small><img class="emoji" draggable="false" alt="4️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/34-20e3.svg" data-marp-twemoji=""/></small></td>
</tr>
</tbody>
</table>
<ol>
<li>意圖為自己或第三人不法之所有，以強暴、脅迫、藥劑、催眠術或他法，至使不能抗拒，而取他人之物或使其交付者，為強盜罪，處5年以上有期徒刑。</li>
<li>意圖為自己或第三人不法之所有，而搶奪他人之動產者，處6月以上5年以下有期徒刑。</li>
<li>意圖為自己或第三人不法之所有，而竊取他人之動產者，為竊盜罪，處5年以下有期徒刑、拘役或50萬元以下罰金。</li>
<li>意圖為自己或第三人不法之所有，而侵占自己持有他人之物者，處5年以下有期徒刑、拘役或科或併科3萬元以下罰金。</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" data-marpit-pagination="9" style="--paginate:true;--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48">
<h3 id="%E8%B2%A1%E7%94%A2">財產</h3>
<ul>
<li>電信詐欺 / 詐欺 / 偽造文書</li>
<li>洗錢</li>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-footer="[詐騙集團內部運作解密！如果不小心匯款怎麼辦？檢察官教你最重要的事](https://www.bnext.com.tw/article/75428/financial-fraud-topics-prosecutor)" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" data-marpit-pagination="10" style="--paginate:true;--footer:[詐騙集團內部運作解密！如果不小心匯款怎麼辦？檢察官教你最重要的事](https://www.bnext.com.tw/article/75428/financial-fraud-topics-prosecutor);--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48"><div align="center">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-marpit-scope-zPhDOKD9="" data-marpit-fragments="1" data-paginate="true" data-footer="[你了解詐騙集團嗎? 詐欺集團的組織分工及求職陷阱](https://www.tpc.moj.gov.tw/292885/976681/661783/1239674/post)" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" data-marpit-pagination="11" style="--paginate:true;--footer:[你了解詐騙集團嗎? 詐欺集團的組織分工及求職陷阱](https://www.tpc.moj.gov.tw/292885/976681/661783/1239674/post);--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48">
<h2 id="%E8%A9%90%E6%AC%BA%E9%9B%86%E5%9C%98%E7%B5%84%E7%B9%94%E7%B0%A1%E4%BB%8B">詐欺集團組織簡介</h2>
<table>
<thead>
<tr>
<th style="text-align:right">角色</th>
<th style="text-align:left">說明</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:right">首腦</td>
<td style="text-align:left">整個集團的領導者，負責詐騙工作的策劃及分工</td>
</tr>
<tr>
<td style="text-align:right">行騙者</td>
<td style="text-align:left">機房成員，實際與被害人互動並騙取匯款，方式可能包含電話/簡訊/通訊軟體等</td>
</tr>
<tr>
<td style="text-align:right">取簿手</td>
<td style="text-align:left">收受人頭帳戶，方式可能包含前往超商、置物櫃等</td>
</tr>
<tr>
<td style="text-align:right">車手</td>
<td style="text-align:left">將贓款提領出來，或是向被害人面交詐欺贓款</td>
</tr>
<tr>
<td style="text-align:right">監控手</td>
<td style="text-align:left">監控車手領錢狀況</td>
</tr>
<tr>
<td style="text-align:right">收水手</td>
<td style="text-align:left">收受車手提領出的贓款，再把錢交給上手，或透過各管道輾轉將錢交回集團</td>
</tr>
</tbody>
</table>
<ul>
<li data-marpit-fragment="1"><img class="emoji" draggable="false" alt="🔺" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f53a.svg" data-marp-twemoji=""/> 人數分配</li>
</ul>
<footer><a href="https://www.tpc.moj.gov.tw/292885/976681/661783/1239674/post">你了解詐騙集團嗎? 詐欺集團的組織分工及求職陷阱</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-footer="[你了解詐騙集團嗎? 詐欺集團的組織分工及求職陷阱](https://www.tpc.moj.gov.tw/292885/976681/661783/1239674/post)" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" data-marpit-pagination="12" style="--paginate:true;--footer:[你了解詐騙集團嗎? 詐欺集團的組織分工及求職陷阱](https://www.tpc.moj.gov.tw/292885/976681/661783/1239674/post);--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48">
<h2 id="%E8%A9%90%E6%AC%BA%E9%9B%86%E5%9C%98%E7%B5%84%E7%B9%94%E7%B0%A1%E4%BB%8B-1">詐欺集團組織簡介</h2>
<p>由於<strong>首腦</strong>通常隱身幕後，因此往往也是最難抓到的詐騙集團成員。</p>
<p>收水手的功能在於透過輾轉交付金錢的過程，增加金流上的斷點、造成警方查緝困難。</p>
<p>由於<strong>取簿手</strong>、<strong>車手</strong>、<strong>收水手</strong>的工作內容需要在外拋頭露面，因而也是整個詐騙集團中最容易遭查獲、取代性也最高的成員，所以也是詐欺集團成員最有可能利用圈套誘使民眾前往擔任的角色。</p>
<footer><a href="https://www.tpc.moj.gov.tw/292885/976681/661783/1239674/post">你了解詐騙集團嗎? 詐欺集團的組織分工及求職陷阱</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-marpit-scope-QbJtCLOy="" data-paginate="true" data-footer="[法務統計 2022-2026](https://www.rjsd.moj.gov.tw/RJSDWeb/visualize/Visualization.aspx?kind=PC&amp;d=12)" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" data-marpit-pagination="13" style="--paginate:true;--footer:[法務統計 2022-2026](https://www.rjsd.moj.gov.tw/RJSDWeb/visualize/Visualization.aspx?kind=PC&amp;d=12);--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48">

<h2 id="%E6%B3%95%E5%BE%8B%E8%B2%AC%E4%BB%BB">法律責任</h2>
<p>各角色該不該罰、罰多重？</p>
<ol start="0">
<li>（人頭帳戶）</li>
<li>首腦</li>
<li>行騙者</li>
<li>取簿手</li>
<li>車手</li>
<li>監控手</li>
<li>收水手</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-marpit-scope-eGtSh6Mo="" data-paginate="true" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" data-marpit-pagination="16" style="--paginate:true;--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48">
<h3 id="%E8%A9%90%E6%AC%BA--%E5%88%91%E6%B3%95">詐欺 — 刑法</h3>
<table>
<thead>
<tr>
<th style="text-align:left"></th>
<th style="text-align:right">罪名</th>
<th style="text-align:left">罰則</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">§339 I</td>
<td style="text-align:right">詐欺</td>
<td style="text-align:left">5年以下有期徒刑、拘役 <small><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/></small></td>
</tr>
<tr>
<td style="text-align:left">§339-4 I</td>
<td style="text-align:right">加重詐欺</td>
<td style="text-align:left">1年以上7年以下有期徒刑 <small><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/32-20e3.svg" data-marp-twemoji=""/></small></td>
</tr>
</tbody>
</table>
<ol>
<li>意圖為自己或第三人不法之所有，以詐術使人將本人或第三人之物交付者，處5年以下有期徒刑、拘役或科或併科50萬元以下罰金。</li>
<li>犯第339條詐欺罪而有下列情形之一者，處1年以上7年以下有期徒刑，得併科100萬元以下罰金：<br />
一、冒用政府機關或公務員名義犯之。<br />
二、三人以上共同犯之。<br />
三、以廣播電視、電子通訊、網際網路或其他媒體等傳播工具，對公眾散布而犯之。<br />
四、以電腦合成或其他科技方法製作關於他人不實影像、聲音或電磁紀錄之方法犯之。</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-marpit-scope-WJVpYTft="" data-paginate="true" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" data-marpit-pagination="17" style="--paginate:true;--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48">
<h3 id="%E8%A9%90%E6%AC%BA--%E8%A9%90%E6%AC%BA%E7%8A%AF%E7%BD%AA%E5%8D%B1%E5%AE%B3%E9%98%B2%E5%88%B6%E6%A2%9D%E4%BE%8B">詐欺 — 詐欺犯罪危害防制條例</h3>
<table>
<thead>
<tr>
<th style="text-align:left"></th>
<th style="text-align:right">罪名</th>
<th style="text-align:left">罰則</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">§43 前</td>
<td style="text-align:right">加重詐欺+100萬</td>
<td style="text-align:left">3年以上10年以下有期徒刑 <small><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/></small></td>
</tr>
<tr>
<td style="text-align:left">§43 中</td>
<td style="text-align:right">加重詐欺+1千萬</td>
<td style="text-align:left">5年以上12年以下有期徒刑 <small><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/></small></td>
</tr>
<tr>
<td style="text-align:left">§43 後</td>
<td style="text-align:right">加重詐欺+1億</td>
<td style="text-align:left">7年以上有期徒刑 <small><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/></small></td>
</tr>
<tr>
<td style="text-align:left">§44 I</td>
<td style="text-align:right">加重詐欺++</td>
<td style="text-align:left">加重其刑1/2 <small><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/32-20e3.svg" data-marp-twemoji=""/></small></td>
</tr>
</tbody>
</table>
<ol>
<li>犯刑法第339-4條之罪，使人交付之財物或財產上利益達新臺幣100萬元者，處3年以上10年以下有期徒刑，得併科新臺幣3千萬元以下罰金。使人交付之財物或財產上利益達新臺幣1千萬元者，處5年以上12年以下有期徒刑，得併科新臺幣3億元以下罰金。使人交付之財物或財產上利益達新臺幣1億元者，處7年以上有期徒刑，得併科新臺幣5億元以下罰金。</li>
<li>犯刑法第339-4條第1項第2款之罪，有下列情形之一者，依該條項規定加重其刑1/2：<br />
一、並犯同條項第1款、第3款或第4款之一。<br />
二、在中華民國領域外以供詐欺犯罪所用之設備，對於中華民國領域內之人犯之。<br />
三、教唆、幫助或利用未滿十八歲、滿八十歲或非本國籍人士犯罪或與之共同實施犯罪。</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-marpit-scope-C4phNbpP="" data-paginate="true" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" data-marpit-pagination="18" style="--paginate:true;--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48">
<h2 id="%E6%B4%97%E9%8C%A2">洗錢</h2>
<p>洗錢防制法 §2（洗錢定義）</p>
<p>本法所稱洗錢，指下列行為：<br />
一、隱匿特定犯罪所得或掩飾其來源。<br />
二、妨礙或危害國家對於特定犯罪所得之調查、發現、保全、沒收或追徵。<br />
三、收受、持有或使用他人之特定犯罪所得。<br />
四、使用自己之特定犯罪所得與他人進行交易。</p>
<p>洗錢防制法 §22 I（人頭帳戶）</p>
<p>任何人不得將自己或他人向金融機構申請開立之帳戶、向提供虛擬資產服務或第三方支付服務之事業或人員申請之帳號交付、提供予他人使用。但符合一般商業、金融交易習慣，或基於親友間信賴關係或其他正當理由者，不在此限。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-marpit-scope-bfNvlGyn="" data-paginate="true" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" data-marpit-pagination="19" style="--paginate:true;--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48">
<h3 id="%E6%B4%97%E9%8C%A2--%E6%B4%97%E9%8C%A2%E9%98%B2%E5%88%B6%E6%B3%95">洗錢 — 洗錢防制法</h3>
<table>
<thead>
<tr>
<th style="text-align:left"></th>
<th style="text-align:right">罪名</th>
<th style="text-align:left">罰則</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">§19 I 前</td>
<td style="text-align:right">洗錢</td>
<td style="text-align:left">3年以上10年以下有期徒刑 <small><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/></small></td>
</tr>
<tr>
<td style="text-align:left">§19 I 後</td>
<td style="text-align:right">洗錢+未達1億元</td>
<td style="text-align:left">6月以上5年以下有期徒刑 <small><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/></small></td>
</tr>
<tr>
<td style="text-align:left">§21 I</td>
<td style="text-align:right">收集人頭帳戶</td>
<td style="text-align:left">5年以下有期徒刑、拘役 <small><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/32-20e3.svg" data-marp-twemoji=""/></small></td>
</tr>
</tbody>
</table>
<ol>
<li>有第2條各款所列洗錢行為者，處3年以上10年以下有期徒刑，併科新臺幣1億元以下罰金。其洗錢之財物或財產上利益未達新臺幣1億元者，處6月以上5年以下有期徒刑，併科新臺幣5,000萬元以下罰金。</li>
<li>無正當理由收集他人向金融機構申請開立之帳戶、向提供虛擬資產服務或第三方支付服務之事業或人員申請之帳號，而有下列情形之一者，處5年以下有期徒刑、拘役或科或併科新臺幣3,000萬元以下罰金：<br />
一、冒用政府機關或公務員名義犯之。<br />
二、以廣播電視、電子通訊、網際網路或其他媒體等傳播工具，對公眾散布而犯之。<br />
三、以電腦合成或其他科技方法製作關於他人不實影像、聲音或電磁紀錄之方法犯之。<br />
四、以期約或交付對價使他人交付或提供而犯之。<br />
五、以強暴、脅迫、詐術、監視、控制、引誘或其他不正方法而犯之。</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-marpit-scope-4XvUGomy="" data-paginate="true" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" data-marpit-pagination="20" style="--paginate:true;--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48">
<h3 id="%E6%B4%97%E9%8C%A2--%E6%B4%97%E9%8C%A2%E9%98%B2%E5%88%B6%E6%B3%95-1">洗錢 — 洗錢防制法</h3>
<table>
<thead>
<tr>
<th style="text-align:left"></th>
<th style="text-align:right">罪名</th>
<th style="text-align:left">罰則</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">§20 I</td>
<td style="text-align:right">特殊洗錢</td>
<td style="text-align:left">6月以上5年以下有期徒刑 <small><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/></small></td>
</tr>
<tr>
<td style="text-align:left">§22 III</td>
<td style="text-align:right">交付人頭帳戶</td>
<td style="text-align:left">3年以下有期徒刑、拘役 <small><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/32-20e3.svg" data-marp-twemoji=""/></small></td>
</tr>
</tbody>
</table>
<ol>
<li>收受、持有或使用之財物或財產上利益，有下列情形之一，而無合理來源者，處6月以上5年以下有期徒刑，得併科新臺幣5,000萬元以下罰金：<br />
一、冒名、以假名或其他與身分相關之不實資訊向金融機構、提供虛擬資產服務或第三方支付服務之事業或人員申請開立帳戶、帳號。<br />
二、以不正方法取得、使用他人向金融機構申請開立之帳戶、向提供虛擬資產服務或第三方支付服務之事業或人員申請之帳號。<br />
三、規避第8條、第10條至第13條所定洗錢防制程序。</li>
<li>違反第1項規定而有下列情形之一者，處3年以下有期徒刑、拘役或科或併科新臺幣100萬元以下罰金：<br />
一、期約或收受對價而犯之。<br />
二、交付、提供之帳戶或帳號合計3個以上。<br />
三、經直轄市、縣（市）政府警察機關依前項或第4項規定裁處後，5年以內再犯。</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-marpit-scope-CfNN4RWh="" data-paginate="true" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" data-marpit-pagination="21" style="--paginate:true;--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48">
<h2 id="%E7%B5%84%E7%B9%94%E7%8A%AF%E7%BD%AA">組織犯罪</h2>
<p>組織犯罪防制條例 §2</p>
<ol>
<li>本條例所稱犯罪組織，指三人以上，以實施強暴、脅迫、詐術、恐嚇為手段或最重本刑逾5年有期徒刑之刑之罪，所組成具有持續性或牟利性之有結構性組織。</li>
<li>前項有結構性組織，指非為立即實施犯罪而隨意組成，不以具有名稱、規約、儀式、固定處所、成員持續參與或分工明確為必要。</li>
</ol>
<p>組織犯罪防制條例 §3 I</p>
<p>發起、主持、操縱或指揮犯罪組織者，處3年以上10年以下有期徒刑，得併科新臺幣1億元以下罰金；參與者，處6月以上5年以下有期徒刑，得併科新臺幣1千萬元以下罰金。但參與情節輕微者，得減輕或免除其刑。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-marpit-scope-TnynQNTL="" data-paginate="true" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" data-marpit-pagination="22" style="--paginate:true;--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48">
<h2 id="%E6%AD%A3%E7%8A%AF--%E6%95%99%E5%94%86%E7%8A%AF--%E5%B9%AB%E5%8A%A9%E7%8A%AF">正犯 / 教唆犯 / 幫助犯</h2>
<p>刑法 §28</p>
<p>二人以上共同實行犯罪之行為者，皆為正犯。</p>
<p>刑法 §29</p>
<ol>
<li>教唆他人使之實行犯罪行為者，為教唆犯。</li>
<li>教唆犯之處罰，依其所教唆之罪處罰之。</li>
</ol>
<p>刑法 §30</p>
<ol>
<li>幫助他人實行犯罪行為者，為幫助犯。雖他人不知幫助之情者，亦同。</li>
<li>幫助犯之處罰，得按正犯之刑減輕之。</li>
</ol>
</section>

<header>車手</header>

<h3 id="%E6%B3%95%E9%99%A2%E8%AA%8D%E5%AE%9A">法院認定</h3>
<p>林〇如遭到本案詐欺集團成員透過Facebook稱：可投資虛擬貨幣獲利等語，致陷於錯誤，依指示陸續交付款項後，察覺有異而報警，並配合員警進行偵辦，假意與詐欺集團不詳成員相約在臺中市某址附近交付現金新臺幣300萬元投資款；而陳〇龍自加入詐欺集團時起與該集團成員共同基於犯詐欺取財及洗錢的犯意聯絡，持用手機與詐欺集團成員聯絡，依其指示按照約定時間抵達上開地點，監控手則依詐欺集團成員指示，在旁監控並等待陳〇龍收取贓款。雙方見面後，陳〇龍取得林〇如交付的款項後，立即被埋伏的員警逮捕而未遂，並扣得手機1支及現金300萬元。</p>
<p><img class="emoji" draggable="false" alt="⚖️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2696.svg" data-marp-twemoji=""/> 判決主文：陳〇龍犯三人以上共同詐欺取財未遂罪，處有期徒刑1年2月。扣案手機1支沒收。</p>
<footer>最高法院115年度台上字第3246號刑事判決 + 臺灣高等法院臺中分院115年度金上訴字第288號刑事判決</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-marpit-scope-wxmQKqcn="" data-paginate="true" data-header="車手" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" data-marpit-pagination="27" style="--paginate:true;--header:車手;--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48">
<header>車手</header>

<h3 id="%E4%B8%8D%E7%9F%A5%E8%80%85%E7%84%A1%E7%BD%AA%E2%9D%93">不知者無罪<img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/></h3>
<p>臺灣高等法院臺中分院115年度金上訴字第288號刑事判決 [二審]</p>
<p>陳〇龍坦承於上開時、地如何依詐欺集團成員指示向林〇如收取款項後，經埋伏員警逮捕而未遂等情，惟矢口否認有何參與犯罪組織、三人以上共同詐欺取財及一般洗錢犯行，並辯稱略為：我當時不知道自己當了車手，我去領錢時是被騙及不知情等語。</p>
<p>經查：...刑法上故意，分直接故意（確定故意）與間接故意（不確定故意），行為人對於構成犯罪之事實，明知並有意使其發生者，為直接故意；行為人對於構成犯罪之事實，預見其發生而其發生並不違背其本意者，為間接故意。又共同實施犯罪行為之人，在合同意思範圍內，各自分擔犯罪行為之一部，相互利用他人之行為，以達其犯罪之目的，故其所實行之行為，非僅就自己實行之行為負責，並在犯意聯絡之範圍內，對於他共同正犯所實行之行為，亦應共同負責。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-marpit-scope-XrBtaJmg="" data-paginate="true" data-header="車手" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" data-marpit-pagination="28" style="--paginate:true;--header:車手;--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48">
<header>車手</header>

<h3 id="%E5%85%B7%E4%B8%80%E8%88%AC%E6%99%BA%E8%AD%98%E4%B9%8B%E4%BA%BA%E6%87%89%E5%8F%AF%E9%A0%90%E8%A6%8B%E2%AD%95">具一般智識之人應可預見<img class="emoji" draggable="false" alt="⭕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2b55.svg" data-marp-twemoji=""/></h3>
<p>臺灣高等法院臺中分院115年度金上訴字第288號刑事判決 [二審]（續）</p>
<p>陳〇龍雖以前詞置辯，但他與詐欺集團成員、洪〇政及上開詐欺集團成員如何共同為上開犯行，已經陳〇龍於原審審理時坦承不諱，並為認罪的答辯，且依陳〇龍...警詢時供稱「（問：如果收款有成功，要怎麼在往上交付？）等到收到錢後，他會指示我把錢放在公園廁所，他會在請人過去拿」、「（問：你收取客戶款項後，要再將贓款放置在公園廁所等上頭派人收取，你認為符合正常邏輯及交易習慣嗎？）我也有覺得很奇怪」等語，顯見陳〇龍負責向被害人收取贓款後依上手指示如何轉交等行徑，嚴重違背交易常情，足認陳〇龍可以預見自己提領、轉出與財產犯罪有關的款項，藉以逃避查緝等情，...</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-marpit-scope-A9pNDrYV="" data-paginate="true" data-header="車手" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" data-marpit-pagination="29" style="--paginate:true;--header:車手;--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48">
<header>車手</header>

<h3 id="%E5%85%B7%E4%B8%80%E8%88%AC%E6%99%BA%E8%AD%98%E4%B9%8B%E4%BA%BA%E6%87%89%E5%8F%AF%E9%A0%90%E8%A6%8B%E2%AD%95-1">具一般智識之人應可預見<img class="emoji" draggable="false" alt="⭕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2b55.svg" data-marp-twemoji=""/></h3>
<p>臺灣高等法院臺中分院115年度金上訴字第288號刑事判決 [二審]（續）</p>
<p>...而陳〇龍竟擔任面交車手，聽從詐欺集團成員指示負責收取詐欺所得贓款，並層轉贓款洗錢，則具一般智識之人應可認知此事與一般正常合法的工作顯然不同，陳〇龍主觀上可預見所從事的工作可能涉及不法，再參諸大眾媒體不斷披露詐欺集團假藉投資之名詐騙被害人使其等匯款或面交金錢，並由車手領取詐得款項，一般民眾已有所認知，陳〇龍卻為仍夥同詐欺集團成員、洪〇政為之，他主觀上對於自己所從事的工作是為詐欺集團收取詐欺所得贓款，再轉交予其他成員（亦即擔任車手），而成為詐欺集團的一員，應有所預見，他卻仍執意共犯上開行為，可認他具有三人以上共同詐欺取財、參與犯罪組織及洗錢的之不確定故意。陳〇龍於本院審理時改詞否認犯行，所辯前詞難以採為有利的認定。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-footer="最高法院111年度台上字第3973號刑事判決 + 臺灣高等法院110年度原上訴字第59號刑事判決" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" data-marpit-pagination="30" style="--paginate:true;--footer:最高法院111年度台上字第3973號刑事判決 + 臺灣高等法院110年度原上訴字第59號刑事判決;--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48">

<header>取簿手</header>

<h3 id="%E6%B3%95%E9%99%A2%E8%AA%8D%E5%AE%9A-1">法院認定</h3>
<p>詐欺集團成員於向告訴人/被害人表示可協助申辦貸款，但須提供存摺、金融卡及密碼云云，致告訴人/被害人陷於錯誤，將帳戶之金融卡及存摺影本以便利超商交貨便寄至便利超商門市。</p>
<p>陳〇嘉在便利超商門市領取包裹後，至捷運站附近之某店門口，交付予收水手/車手。</p>
<p><img class="emoji" draggable="false" alt="⚖️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2696.svg" data-marp-twemoji=""/> 判決主文：陳〇嘉犯如附表五編號1至11所示之罪，各處如附表五編號1至11所示之刑及沒收。應執行有期徒刑2年6月。</p>
<footer>最高法院111年度台上字第3973號刑事判決 + 臺灣高等法院110年度原上訴字第59號刑事判決</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-marpit-scope-ardmraqk="" data-paginate="true" data-header="取簿手" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" data-marpit-pagination="32" style="--paginate:true;--header:取簿手;--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48">
<header>取簿手</header>

<h3 id="%E5%85%B1%E5%90%8C%E6%AD%A3%E7%8A%AF%E2%9D%93">共同正犯<img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/></h3>
<p>最高法院111年度台上字第3973號刑事判決</p>
<p>共同正犯間，在合同意思範圍內，相互利用他人之行為，以達其犯罪之目的，原不必每一階段均參與，祇須分擔犯罪行為之一部，即應對於全部所發生之結果共同負責。且數共同正犯之間，原不以直接發生犯意聯絡者為限，即有間接之聯絡者，亦包括在內，也不限於事前有所協議，於行為當時，基於相互之認識，以共同犯罪之意思參與者，亦無礙於共同正犯之成立。是以多數人依其角色分配共同協力參與犯罪構成要件之實現，其中部分行為人雖未參與犯罪構成要件行為之實行，但其所為構成要件以外行為，對於實現犯罪目的具有不可或缺之地位，仍可成立共同正犯。至有無犯意聯絡，乃存在於各行為人內心之事實，是以法院在欠缺直接證據之情況下，尚非不得綜合客觀事證認定之。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-marpit-scope-J3Q52g4M="" data-paginate="true" data-header="取簿手" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" data-marpit-pagination="33" style="--paginate:true;--header:取簿手;--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48">
<header>取簿手</header>

<h3 id="%E5%85%B1%E5%90%8C%E6%AD%A3%E7%8A%AF%E2%9D%93-1">共同正犯<img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/></h3>
<p>最高法院111年度台上字第3973號刑事判決（續）</p>
<p>而詐欺集團為實行詐術騙取款項，並蒐羅、使用人頭帳戶以躲避追緝，各犯罪階段緊湊相連，仰賴多人縝密分工，相互為用，方能完成之集團性犯罪，雖各共同正犯僅分擔實行其中部分行為，仍應就全部犯罪事實共同負責。是以部分詐欺集團成員縱未直接對被害人施以詐術，如有接收人頭帳戶金融卡供為實行詐騙所用，或配合提領款項，均係該詐欺集團犯罪歷程不可或缺之重要環節，尤其是分擔接收人頭帳戶之「取簿手」及配合提領贓款之「車手」，當被害人遭詐欺集團成員詐騙後，雖已將款項匯入詐欺集團指定之人頭帳戶，但上開款項在詐欺集團成員實際提領前，該帳戶隨時有被查覺而遭凍結之可能，是配合接收人頭帳戶金融卡，以供其他詐欺集團成員提領贓款，更是詐欺集團實現犯罪目的之關鍵行為，此應為參與成員主觀上所知悉之範圍，猶各自分擔犯罪行為之一部，而相互利用其他詐欺集團成員之部分行為以遂行犯罪之目的，即應就其所參與並有犯意聯絡之犯罪事實同負全責。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-marpit-scope-Htwth1Od="" data-paginate="true" data-header="取簿手" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" data-marpit-pagination="34" style="--paginate:true;--header:取簿手;--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48">
<header>取簿手</header>

<h3 id="%E5%85%B1%E5%90%8C%E6%AD%A3%E7%8A%AF%E2%AD%95">共同正犯<img class="emoji" draggable="false" alt="⭕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2b55.svg" data-marp-twemoji=""/></h3>
<p>最高法院111年度台上字第3973號刑事判決（續）</p>
<p>原判決綜合上訴人不利己之部分供述，及如其附表二、四所示證人即告訴人、被害人等之證詞、通訊軟體對話紀錄截圖、超商交貨便服務單、金融機構帳戶資料、取簿過程監視錄影畫面截圖、報案紀錄、提款過程監視錄影畫面截圖、銀行交易明細，佐以如其附表六所示扣案物品，暨案內其他證據資料，相互勾稽結果，憑以判斷認定上訴人有事實欄所示犯罪事實，依序記明所憑證據及認定之理由，已論述綦詳。所為論斷說明，俱有各項證據資料可稽，既係綜合調查所得之各直接、間接證據而為合理推論，並未違背客觀存在之經驗法則與論理法則，要無違法可言。上訴人於加入詐欺集團後，既擔任「取簿手」工作，已分擔實行其中部分行為，而屬整體詐欺行為分工之一環，且利用他人之行為，達成詐欺犯罪之結果，仍應就全部犯罪事實共同負責。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-marpit-scope-TVWqx5d4="" data-paginate="true" data-header="取簿手" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" data-marpit-pagination="35" style="--paginate:true;--header:取簿手;--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48">
<header>取簿手</header>

<h3 id="%E6%95%85%E6%84%8F%E2%9D%93">故意<img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/></h3>
<p>臺灣高等法院110年度原上訴字第59號刑事判決 [二審]</p>
<p>陳〇婷、林〇娟、謝〇勳對其等有以不確定之故意，而犯上開加重詐欺及參與犯罪組織等罪，於本院審理中已坦承不諱；至於<strong>陳〇嘉</strong>雖仍矢口否認涉有加重詐欺、洗錢及參與犯罪組織等罪，並辯稱：只是看報紙應徵臨時工，對於造成被害人之損失是無心的云云，但查：按行為人對於構成犯罪之事實，明知並有意使其發生者，為故意。行為人對於構成犯罪之事實，預見其發生而其發生並不違背其本意者，以故意論，刑法第13條定有明文。是故意之成立，不以對於構成犯罪之事實，明知並有意使其發生為必要，倘行為人認識或預見其行為會導致某構成要件實現（結果發生），縱其並非積極欲求該構成要件實現（結果發生），惟為達到某種目的而仍容任該結果發生，亦屬法律意義上之容任或接受結果發生之「間接故意」，此即前揭法條所稱之「以故意論」。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-marpit-scope-hIGhu6nj="" data-paginate="true" data-header="取簿手" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" data-marpit-pagination="36" style="--paginate:true;--header:取簿手;--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48">
<header>取簿手</header>

<h3 id="%E6%95%85%E6%84%8F%E2%9D%93-1">故意<img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/></h3>
<p>臺灣高等法院110年度原上訴字第59號刑事判決 [二審]（續）</p>
<p>茲當前社會合法提供包裹寄送服務之業者眾多，服務項目非僅快速、多元、周全，收費亦屬實惠，兼有嚴謹稽核制度，據以保障寄、收件雙方當事人之權益，該等業者且或提供前往指定收件之服務，或與遍佈大街小巷之便利超商存有合作關係，以利於一般大眾使用，倘非所欲領取之物品涉及不法，且寄件或收件之一方有意隱瞞身份以規避稽查，當無另以報酬刻意委請專人領取包裹之必要，陳〇嘉既係智識健全之成年人，對此自難諉為不知。且陳〇嘉亦自陳：拿了第1個包裹後，覺得這麼輕，心裡曾質疑為何不叫快遞就好，且在交包裹給蔡〇昌後，蔡〇昌就接到電話叫他去廁所拆包裹，眼角餘光看到該包裹內有些證件，有跟蔡〇昌說其覺得怪怪的，且後來蔡〇昌拆完包裹後，又問附近哪裡有銀行，有覺得這麼小的包裹，要先去拿後，再轉交給蔡〇昌這個過程很奇怪，而原本對方是說每月可以領3萬元，後來又說每領1個包裹給500元，但一直沒有匯等語，可知陳〇嘉對於工作內容，顯然悖於一般社會常情，確有所認知，方生上開之懷疑。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-marpit-scope-4nOEDAML="" data-paginate="true" data-header="取簿手" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" data-marpit-pagination="37" style="--paginate:true;--header:取簿手;--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48">
<header>取簿手</header>

<h3 id="%E4%B8%8D%E7%A2%BA%E5%AE%9A%E6%95%85%E6%84%8F%E2%AD%95">不確定故意<img class="emoji" draggable="false" alt="⭕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2b55.svg" data-marp-twemoji=""/></h3>
<p>臺灣高等法院110年度原上訴字第59號刑事判決 [二審]（續）</p>
<p>綜上，堪認陳〇嘉主觀上應可知悉所經手之包裹並非合法，僅因貪圖對方承諾之報酬，方對於自身成為詐欺集團成員所指揮之取簿手，領取他人遭詐欺而交付之金融資料，並使詐欺集團用以隱匿詐欺所得財物之去向等結果，仍予以容任發生，就客觀上所犯上開加重詐欺、洗錢及參與犯罪組織等罪，自亦有不確定之故意。</p>
</section>

<header>人頭帳戶</header>

<h3 id="%E6%B3%95%E9%99%A2%E8%AA%8D%E5%AE%9A-2">法院認定</h3>
<p>林〇霆以Line向詐欺集團成員詢問家庭代工訊息，其向林〇霆表示：每提供1張金融卡，可獲得新臺幣1萬元補助等語。</p>
<p>林〇霆依其智識程度及一般社會生活之通常經驗，知悉不得將自己或他人向金融機構申請開立之帳戶交付、提供予他人使用，且金融帳戶為個人理財之工具，攸關個人財務甚切，具有高度屬人性質，若無正當理由交付、提供予他人使用，與一般商業、金融交易習慣不符，竟在超商門市內，將其申辦之金融卡5張，以交貨便方式寄交詐欺集團成員，而後以Line傳送金融卡密碼並提供帳戶予詐欺集團成員使用。</p>
<p><img class="emoji" draggable="false" alt="⚖️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2696.svg" data-marp-twemoji=""/> 判決主文：林〇霆處有期徒刑2月，如易科罰金，以新臺幣1,000元折算1日。</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-marpit-scope-BcsCjUy4="" data-paginate="true" data-header="人頭帳戶" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" data-marpit-pagination="40" style="--paginate:true;--header:人頭帳戶;--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48">
<header>人頭帳戶</header>

<h3 id="%E7%94%B3%E8%BE%A6%E8%B2%B8%E6%AC%BE%E6%87%89%E5%BE%B5%E5%B7%A5%E4%BD%9C%E2%9D%93">申辦貸款、應徵工作<img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/></h3>
<p>臺灣嘉義地方法院113年度金易字第12號刑事判決 [一審]</p>
<p>洗錢防制法第22條第3項第2款、第1項...立法理由乃「...任何人除基於符合一般商業、金融交易習慣，或基於親友間信賴關係或其他正當理由以外，不得將帳戶、帳號交付、提供予他人使用之法定義務，並以上開所列正當理由作為本條違法性要素判斷標準。又本條所謂『交付、提供帳戶、帳號予他人使用』，係指將帳戶、帳號之控制權交予他人，如單純提供、交付金融卡及密碼委託他人代為領錢、提供帳號予他人轉帳給自己等，因相關交易均仍屬本人金流，並非本條所規定之交付、提供『他人』使用。另現行實務常見以申辦貸款、應徵工作等方式要求他人交付、提供人頭帳戶、帳號予他人使用，均與一般商業習慣不符，蓋因申辦貸款、應徵工作僅需提供個人帳戶之帳號資訊作為收受貸放款項或薪資之用，並不需要交付、提供予放貸方、資方使用帳戶、帳號支付功能所需之必要物品（例如金融卡、U盾等）或資訊（例如帳號及密碼、驗證碼等）；易言之，以申辦貸款、應徵工作為由交付或提供帳戶、帳號予他人『使用』，已非屬本條所稱之正當理由。惟倘若行為人受騙而對於構成要件無認識時，因欠缺主觀故意，自不該當本條處罰。」</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-marpit-scope-qd09w0mb="" data-paginate="true" data-header="人頭帳戶" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" data-marpit-pagination="41" style="--paginate:true;--header:人頭帳戶;--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48">
<header>人頭帳戶</header>

<h3 id="%E7%94%B3%E8%BE%A6%E8%B2%B8%E6%AC%BE%E6%87%89%E5%BE%B5%E5%B7%A5%E4%BD%9C%E2%9D%8C--%E4%B8%8D%E8%A6%81%E6%B1%82%E4%B8%BB%E8%A7%80%E6%95%85%E6%84%8F">申辦貸款、應徵工作<img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> — 不要求主觀故意</h3>
<p>臺灣嘉義地方法院113年度金易字第12號刑事判決 [一審]（續）</p>
<p>是以，行為人已不能以申辦貸款、應徵工作為由，主張阻卻違法性，且行為人如對客觀構成要件具有故意時，即構成本罪。</p>
<p>任何人無正當理由而將金融帳戶、虛擬帳號交付、提供給他人使用，就一般洗錢罪而言，過往實務雖以特定犯罪及一般洗罪罪之幫助犯論處，惟行為人主觀犯意證明困難，影響人民對司法之信賴，故認有立法予以截堵之必要，從而立法增訂洗錢防制法第22條第3項第2款、第1項規定。因此，洗錢防制法第22條第3項第2款、第1項規定，既是截堵在一般洗錢案件中，行為人幫助故意之證明困難，從而該規定與一般洗錢罪規定之差別，僅在前者不要求行為人主觀上具備幫助他人犯罪之故意（可視為將一般洗錢罪部分之客觀構成要件轉換為客觀處罰條件，以限縮行為人之主觀故意之認識範圍，詳下述），如行為人主觀上具備幫助他人犯罪之故意，則應成立一般洗錢罪。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-header="沒收" data-footer="[犯罪所得「沒收」?「發還被害人」?](https://www.tph.moj.gov.tw/4421/4475/632364/1023427/post)" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" data-marpit-pagination="42" style="--paginate:true;--header:沒收;--footer:[犯罪所得「沒收」?「發還被害人」?](https://www.tph.moj.gov.tw/4421/4475/632364/1023427/post);--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48">
<header>沒收</header>

<h2 id="%E6%B2%92%E6%94%B6--%E4%BB%BB%E4%BD%95%E4%BA%BA%E7%9A%86%E4%B8%8D%E5%BE%97%E4%BF%9D%E6%9C%89%E7%8A%AF%E7%BD%AA%E6%89%80%E5%BE%97">沒收 — 「任何人皆不得保有犯罪所得」</h2>
<p>「沒收新制」，以「任何人皆不得保有犯罪所得」為中心，將「犯罪所得沒收」定性為「準不當得利衡平措施」，而非刑罰，具有填補舊法嚴重漏洞的重要意義，強調任何人不能因為犯罪而保有不法所得。刑法第38條增列了「第三人沒收」，擴大沒收的主體範圍，除了犯罪者的財產外，縱使財產是屬於沒有參與犯罪之「第三人」，包括「自然人、法人或非法人團體」，只要檢察官查到的證據可以認定第三人名下的財產，包含不動產及動產，來自於犯罪行為所產生的所得，都可以用聲請宣告沒收的方式來剝奪犯罪行為人以外之第三人之財產。例如詐騙集團車手或是機房把詐騙來的款項拿來買超跑、名錶或是珠寶，不論登記在誰的名下，依照新法都可以聲請沒收。縱使第三人將犯罪所得變價、出售，國家還可以「追徵其價額」。</p>
<footer><a href="https://www.tph.moj.gov.tw/4421/4475/632364/1023427/post">犯罪所得「沒收」?「發還被害人」?</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-marpit-scope-QrE39b6O="" data-paginate="true" data-header="沒收" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" data-marpit-pagination="43" style="--paginate:true;--header:沒收;--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48">
<header>沒收</header>

<h3 id="%E8%BD%89%E6%89%8B%E4%BB%8D%E8%90%BD%E5%9C%A8%E6%B2%92%E6%94%B6%E7%9A%84%E5%AE%88%E5%82%99%E7%AF%84%E5%9C%8D">「轉手」仍落在沒收的守備範圍</h3>
<table>
<thead>
<tr>
<th style="text-align:left">刑法</th>
<th style="text-align:right">範圍</th>
<th style="text-align:left">對象</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">§38 I</td>
<td style="text-align:right">違禁物</td>
<td style="text-align:left">任何人 <small><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/></small></td>
</tr>
<tr>
<td style="text-align:left">§38 II</td>
<td style="text-align:right">供犯罪所用之物</td>
<td style="text-align:left">犯罪行為人+第三人無正當理由提供或取得 <small><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/32-20e3.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/33-20e3.svg" data-marp-twemoji=""/></small></td>
</tr>
<tr>
<td style="text-align:left">§38 II</td>
<td style="text-align:right">犯罪預備之物</td>
<td style="text-align:left">犯罪行為人+第三人無正當理由提供或取得 <small><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/32-20e3.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/33-20e3.svg" data-marp-twemoji=""/></small></td>
</tr>
<tr>
<td style="text-align:left">§38 II</td>
<td style="text-align:right">因犯罪所生之物</td>
<td style="text-align:left">犯罪行為人+第三人無正當理由提供或取得 <small><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/32-20e3.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/33-20e3.svg" data-marp-twemoji=""/></small></td>
</tr>
</tbody>
</table>
<ol>
<li>違禁物，不問屬於犯罪行為人與否，沒收之。</li>
<li>供犯罪所用、犯罪預備之物或犯罪所生之物，屬於犯罪行為人者，得沒收之。但有特別規定者，依其規定。</li>
<li>前項之物屬於犯罪行為人以外之自然人、法人或非法人團體，而無正當理由提供或取得者，得沒收之。但有特別規定者，依其規定。</li>
<li>前2項之沒收，於全部或一部不能沒收或不宜執行沒收時，追徵其價額。</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-marpit-scope-9G0LFFcp="" data-paginate="true" data-header="沒收" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" data-marpit-pagination="44" style="--paginate:true;--header:沒收;--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48">
<header>沒收</header>

<h3 id="%E7%8A%AF%E7%BD%AA%E6%89%80%E5%BE%97-%E2%88%88-%E5%9B%A0%E7%8A%AF%E7%BD%AA%E6%89%80%E7%94%9F%E4%B9%8B%E7%89%A9">犯罪所得 ∈ 因犯罪所生之物</h3>
<table>
<thead>
<tr>
<th style="text-align:left">刑法</th>
<th style="text-align:right">範圍</th>
<th style="text-align:left">對象</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">§38-1 I</td>
<td style="text-align:right">犯罪所得</td>
<td style="text-align:left">犯罪行為人 <small><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/></small></td>
</tr>
<tr>
<td style="text-align:left">§38-1 II</td>
<td style="text-align:right">犯罪所得</td>
<td style="text-align:left">第三人無正當理由取得 <small><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/32-20e3.svg" data-marp-twemoji=""/></small></td>
</tr>
</tbody>
</table>
<ol>
<li>犯罪所得，屬於犯罪行為人者，沒收之。但有特別規定者，依其規定。</li>
<li>犯罪行為人以外之自然人、法人或非法人團體，因下列情形之一取得犯罪所得者，亦同：<br />
一、明知他人違法行為而取得。<br />
二、因他人違法行為而無償或以顯不相當之對價取得。<br />
三、犯罪行為人為他人實行違法行為，他人因而取得。</li>
<li>前2項之沒收，於全部或一部不能沒收或不宜執行沒收時，追徵其價額。</li>
<li>第1項及第2項之犯罪所得，包括違法行為所得、其變得之物或財產上利益及其孳息。</li>
<li>犯罪所得已實際合法發還被害人者，不予宣告沒收或追徵。</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-marpit-scope-vnqDrVhP="" data-paginate="true" data-header="沒收" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" data-marpit-pagination="45" style="--paginate:true;--header:沒收;--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48">
<header>沒收</header>

<h3 id="%E6%B4%97%E9%8C%A2%E9%98%B2%E5%88%B6%E6%B3%95--%E6%93%B4%E5%A4%A7%E6%B2%92%E6%94%B6%E7%AF%84%E5%9C%8D">洗錢防制法 — 擴大沒收範圍</h3>
<table>
<thead>
<tr>
<th style="text-align:left">洗錢防制法</th>
<th style="text-align:right">範圍</th>
<th style="text-align:left">對象</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">§25 I</td>
<td style="text-align:right">洗錢之財物/利益</td>
<td style="text-align:left">犯罪行為人+第三人 <small><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/></small></td>
</tr>
<tr>
<td style="text-align:left">§25 II</td>
<td style="text-align:right">洗錢以外之財物/利益+來自其他違法行為</td>
<td style="text-align:left">行為人 <small><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/32-20e3.svg" data-marp-twemoji=""/></small></td>
</tr>
</tbody>
</table>
<ol>
<li>犯第19條、第20條之罪，洗錢之財物或財產上利益，不問屬於犯罪行為人與否，沒收之。</li>
<li>犯第19條或第20條之罪，有事實足以證明行為人所得支配之前項規定以外之財物或財產上利益，係取自其他違法行為所得者，沒收之。</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" data-marpit-pagination="46" style="--paginate:true;--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48">
<h2 id="%E7%9F%A5%E8%AD%98%E8%B7%9F%E9%81%93%E5%BE%B7%E5%93%AA%E5%80%8B%E9%87%8D%E8%A6%81">「知識跟道德，哪個重要？」</h2>
<blockquote>
<p>我之前參加國家考試，那個時候都要考國文，特別是作文。</p>
<p>有一次題目是「知識跟道德，哪個重要？」</p>
<p>我毫不猶豫地寫了知識比較重要。</p>
<p>不是說道德不重要，而是「道德」必須建立在「知識」基礎上，道德判斷才會有用，有道德+沒有知識，只是容易被騙的傻瓜而已。</p>
<p>— <a href="https://x.com/klaw1207/status/2016512631126040947">@klaw1207</a></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-class="lead" data-theme="ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k" lang="C" class="lead" data-marpit-pagination="47" style="--paginate:true;--class:lead;--theme:ea29oy5tdzmtouo0eht6nftkp7s5360jmngxr000zm7k;" data-marpit-pagination-total="48">
<h3 id="%E4%BD%A0%E6%8B%BF%E5%B9%B8%E9%81%8B%E5%81%9A%E4%BB%80%E9%BA%BC">「你拿幸運做什麼？」</h3>
<blockquote>
<p>Cleverness is a gift, kindness is a choice.<br />
聰明是一種天賦，而善良是一種選擇。</p>
<p>— Jeff Bezos</p>
</blockquote>
</section>
